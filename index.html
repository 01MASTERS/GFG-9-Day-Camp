<html lang="en" data-theme="dark">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <div class="app" id="app">

          <button class="mode-btn" id="themeBtn">☀ / ☾ Theme</button>
          <button class="mode-btn" id="presentBtn">▣ Present Mode</button>
        </div>
      </header>
      <section id="topicRoot"></section>
      <footer class="credits">DSA Visual Lab — expandable classroom tool · built for 9-day / 18-class DSA course</footer>
    </main>
  </div>

  <!-- Core Utilities -->
  <script src="js/utils.js"></script>

  <script src="js/topics/day2/transpose.js"></script>
  <script src="js/topics/day2/set_zero.js"></script>

  <script src="js/app.js"></script>

  <!-- Agentation Visual Feedback (Development Only — Never loads or runs in Production) -->
  <script type="module">
    if (typeof window !== 'undefined' && (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
      Promise.all([
        import('https://esm.sh/react@18.3.1'),
        import('https://esm.sh/react-dom@18.3.1/client'),
        import('https://esm.sh/agentation@3?deps=react@18.3.1,react-dom@18.3.1')
      ]).then(([ReactModule, ReactDOMClient, AgentationModule]) => {
        const React = ReactModule.default || ReactModule;
        const { createRoot } = ReactDOMClient;
        const { Agentation } = AgentationModule;
        
        let container = document.getElementById('agentation-root');
        if (!container) {
          container = document.createElement('div');
          container.id = 'agentation-root';
          document.body.appendChild(container);
        }
        createRoot(container).render(React.createElement(Agentation));
      }).catch(() => {});
    }
  </script>
</body>
</html>
